# =============================================
# Application SEIMAD - Patrimoine Foncier
# =============================================
spring:
  application:
    name: patrimoine-api

  # ── Datasource PostgreSQL ──
  datasource:
    url: jdbc:postgresql://localhost:5432/gestionpatrimoine
    username: postgres
    password: r
    driver-class-name: org.postgresql.Driver

  # ── SQL init (désactivé : Flyway gère tout) ──
  sql:
    init:
      mode: never

  # ── JPA / Hibernate ──
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway gère le schema, Hibernate valide
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  # ── Flyway ──
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  # ── Jackson ──
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # ── Sécurité ──
  security:
    user:
      name: admin
      password: admin123

# ── JWT ──
jwt:
  # Clé secrète Base64 (minimum 256 bits pour HS256) — à remplacer en production !
  secret: Y2hhdmUtbGEtc2VjdXJpdGUta2V5LWJhc2U2NC12YWx1ZS1wb3VyLWpld3Qtc2VjcmV0LWtleQ==
  access-token-expiration-ms: 900000       # 15 minutes
  refresh-token-expiration-ms: 604800000   # 7 jours

# ── Serveur ──
server:
  port: 8090

# ── Actuator ──
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# ── Logging ──
logging:
  level:
    com.seimad.patrimoine: INFO
    org.flywaydb: INFO
    org.springframework.security: WARN
